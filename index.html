<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --ink: #000000; --ink-soft: #161616; --paper: #ffffff; --paper-dim: #f3f3f3;
      --paper-line: #c8c8c8; --text-on-ink: #ffffff; --text-on-ink-dim: #d0d0d0;
      --text-on-paper: #000000; --text-on-paper-dim: #555555;
      --red: #111111; --amber: #444444; --green: #222222; --kraft: #777777;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink); color: var(--text-on-ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust:100%; }
    h1, .display { font-family: Georgia, 'Times New Roman', serif; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .row { display: flex; align-items: center; gap: 8px; }
    .between { justify-content: space-between; }
    .card { background: var(--paper); color: var(--text-on-paper); border-radius: 4px; padding: 12px; }
    .muted { color: var(--text-on-paper-dim); font-size: 12px; }
    .mutedInk { color: var(--text-on-ink-dim); font-size: 12px; }
    input, select, textarea {
      width: 100%; font-size: 14px; padding: 8px 10px; border-radius: 4px;
      border: 1px solid var(--paper-line); background: var(--paper-dim); color: var(--text-on-paper);
      font-family: inherit;
    }
    label.field { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: var(--text-on-paper-dim); margin-bottom: 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    button { cursor: pointer; border: none; font-family: inherit; font-weight: 700; border-radius: 6px; min-height:44px; touch-action:manipulation; }
    .btn-primary { background: var(--ink); color: var(--text-on-ink); padding: 10px; width: 100%; font-size: 14px; }
    .btn-primary:disabled { opacity: .5; cursor: default; }
    .btn-amber { background: var(--amber); color: var(--ink); padding: 8px 12px; font-size: 12px; }
    .btn-green { background: var(--green); color: var(--paper); padding: 8px 12px; font-size: 12px; }
    .btn-ghost { background: var(--paper-dim); color: var(--text-on-paper); padding: 8px 12px; font-size: 12px; }
    .btn-red { background: var(--red); color: var(--paper); padding: 8px 12px; font-size: 12px; }
    .appHeader { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0 16px; border-bottom:1px solid #444; }
    .brandBlock { display:flex; align-items:center; gap:12px; min-width:0; }
    .brandLogo { height:34px; width:auto; filter:grayscale(1) contrast(1.2); }
    .brandBlock img { height:38px !important; width:auto !important; max-width:160px; }
    .brandTitle { font-size:clamp(18px, 3vw, 26px); margin:0; line-height:1.1; }
    .brandSub { color:var(--text-on-ink-dim); font-size:11px; text-transform:uppercase; letter-spacing:.12em; margin:4px 0 0; }
    .headerActions { display:flex; align-items:center; gap:8px; }
    .headerBtn { min-height:44px; padding:10px 14px; border:1px solid #fff; background:#fff; color:#000; font-size:13px; white-space:nowrap; }
    .headerBtn.secondary { background:#000; color:#fff; }
    .menuToggle { display:none; }
    .dashboardSection { margin-top:18px; }
    .sectionEyebrow { margin:0 0 8px; color:var(--text-on-ink-dim); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .tabs { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:8px; margin-top:18px; padding:8px; background:#111; border:1px solid #444; border-radius:10px; }
    .tab { padding:10px 12px; font-size:13px; font-weight:800; white-space:nowrap; background:#000; color:#fff; border:1px solid #555; border-radius:7px; }
    .tab.active { background:#fff; color:#000; border-color:#fff; }
    .stampBadge { display: inline-block; padding: 1px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; border-radius: 3px; border: 2px dashed; transform: rotate(-4deg); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--text-on-paper-dim); vertical-align: middle; }
    .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 3px; border: 1px solid var(--paper-line); flex-shrink: 0; }
    .thumbEmpty { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
      background: var(--paper-dim); border-radius: 3px; color: var(--text-on-paper-dim); font-size: 20px; flex-shrink: 0; }
    .sampleRow { display: flex; gap: 10px; background: var(--paper); border-radius: 4px; padding: 10px; margin-bottom: 8px; }
    .modalBg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center;
      justify-content: center; padding: 16px; z-index: 50; }
    .modal { width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto; background: var(--paper);
      color: var(--text-on-paper); border-radius: 6px; padding: 16px; }
    .photoThumb { position: relative; display: inline-block; margin: 0 6px 6px 0; }
    .photoThumb img { width: 64px; height: 64px; object-fit: cover; border-radius: 3px; border: 1px solid var(--paper-line); }
    .photoThumb .rm { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
      background: var(--red); color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0; }
    .addPhotoBtn { width: 64px; height: 64px; display: inline-flex; flex-direction: column; align-items: center;
      justify-content: center; background: var(--paper-dim); border: 1px dashed var(--paper-line); border-radius: 3px;
      color: var(--text-on-paper-dim); font-size: 10px; }
    .statCard { background: var(--paper); border:1px solid #fff; border-radius: 8px; padding: 16px 10px; text-align: center; }
    .statVal { font-size: clamp(24px, 5vw, 34px); font-weight: 800; font-family: Georgia, serif; color:#000 !important; }
    .statLabel { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-on-paper-dim); margin-top: 2px; }
    .empty { text-align: center; padding: 40px 12px; color: var(--text-on-ink-dim); font-size: 13px; }
    .banner { background: var(--paper); border-left: 4px solid var(--amber); border-radius: 4px; padding: 10px 14px; margin-bottom: 12px; }
    .errBanner { background: #3a1f1f; border-left: 4px solid var(--red); border-radius: 4px; padding: 10px 14px; margin-bottom: 12px; color: #f2d9d9; font-size: 13px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .avatarEmpty { width: 40px; height: 40px; border-radius: 50%; background: var(--paper-dim); display: flex;
      align-items: center; justify-content: center; color: var(--text-on-paper-dim); flex-shrink: 0; }
    .loading { text-align: center; padding: 60px 0; color: var(--text-on-ink-dim); }
    .loginScreen { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; background:#000; }
    .loginCard { width:100%; max-width:400px; background:var(--paper); color:var(--text-on-paper); padding:clamp(24px, 6vw, 36px); border-radius:12px; border:1px solid #fff; box-shadow:0 20px 60px rgba(255,255,255,.12); }
    .loginCard h1 { margin:0 0 6px; text-align:center; }
    .loginCard input { margin-top:10px; }
    .loginError { color:var(--red); font-size:12px; min-height:18px; margin:8px 0 0; }
    a { color: inherit; }
    @media (max-width: 700px) {
      .wrap { padding-left:12px; padding-right:12px; }
      .appHeader { align-items:flex-start; flex-wrap:wrap; }
      .brandBlock { width:calc(100% - 52px); }
      .brandLogo { height:28px; max-width:105px; object-fit:contain; }
      .menuToggle { display:inline-flex; align-items:center; justify-content:center; width:44px; padding:0; background:#fff; color:#000; border:1px solid #fff; }
      .headerActions { width:100%; display:grid; grid-template-columns:1fr 1fr; }
      .tabs { display:none; grid-template-columns:1fr; position:relative; margin-top:10px; }
      .tabs.open { display:grid; }
      .tab { width:100%; text-align:left; padding:12px 14px; }
      .grid4 { grid-template-columns:repeat(2,1fr); gap:8px; }
      .grid2 { grid-template-columns:1fr; }
      .sampleRow { align-items:flex-start; flex-wrap:wrap; }
      input, select, textarea { font-size:16px; min-height:44px; }
    }
    @media (min-width: 701px) {
      #tabBar { display:grid !important; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>

    <form class="loginCard" onsubmit="loginAdmin(event)">
      <h1>Admin Login</h1>
      <p class="muted" style="text-align:center;">Counter Room Sample Register</p>
      <input id="loginUsername" autocomplete="username" placeholder="Username" required>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
      <p id="loginError" class="loginError"></p>
      <button id="loginButton" class="btn-primary" type="submit">Sign in</button>
    </form>
  </div>

/* ---------------- Firebase backend ---------------- */

function ensureFirebaseApp() {
  if (firebaseConfig.apiKey.indexOf('PASTE_') === 0) {
    throw new Error('Firebase is not configured yet. Add your Firebase web configuration near the top of index.html.');
  }
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
}

async function getFirebaseDb() {
  ensureFirebaseApp();
  const user = firebase.auth().currentUser;
  if (!user || ALLOWED_AUTH_EMAILS.indexOf(user.email) === -1) throw new Error('Authorized sign-in required.');
  if (!firebaseDb) firebaseDb = firebase.database();
  return firebaseDb;
}

async function apiCall(fn, args) {
  const db = await getFirebaseDb();
  const samplesRef = db.ref('samples');
  args = args || [];

  if (fn === 'getSamples') {
    const snap = await samplesRef.once('value');
    const value = snap.val() || {};
    return Object.keys(value).map(function (id) { return Object.assign({ id: id }, value[id]); });
  }
  if (fn === 'getDashboard') {
    const samples = await apiCall('getSamples', []);
    const issued = samples.filter(function (s) { return s.status === 'issued'; });
    return {
      total: samples.length,
      inStore: samples.length - issued.length,
      out: issued.length,
      overdue: issued.filter(function (s) { return s.expectedReturn && Date.now() > s.expectedReturn; }).length
    };
  }
  if (fn === 'getEmployees') {
    const snap = await db.ref('employees').once('value');
    const value = snap.val() || {};
    return Object.keys(value).map(function (id) { return Object.assign({ id: id }, value[id]); });
  }
  if (fn === 'saveEmployee') {
    const employee = Object.assign({}, args[0]);
    const key = employee.id || db.ref('employees').push().key;
    employee.id = key;
    employee.updatedAt = Date.now();
    await db.ref('employees').child(key).set(employee);
    return employee;
  }
  if (fn === 'addSample') {
    const sample = Object.assign({}, args[0]);
    const ref = samplesRef.push();
    sample.id = ref.key;
    sample.status = 'in-room';
    sample.loggedAt = Date.now();
    sample.history = [{ type: 'logged', by: sample.loggedBy, at: sample.loggedAt }];
    await ref.set(sample);
    return sample;
  }
  if (fn === 'updateSample') {
    const id = args[0], patch = args[1] || {};
    await samplesRef.child(id).update(patch);
    const updated = await samplesRef.child(id).once('value');
    if (!updated.exists()) throw new Error('Sample not found');
    return updated.val();
  }
  if (fn === 'deleteSample') {
    await samplesRef.child(args[0]).remove();
    return true;
  }
  if (fn === 'issueSample') {
    const id = args[0], issuedTo = args[1], department = args[2], expectedReturn = args[3];
    const note = args[4], takerPhoto = args[5] || null, byWhom = args[6] || issuedTo;
    const ref = samplesRef.child(id);
    const result = await ref.transaction(function (sample) {
      if (!sample) return sample;
      const at = Date.now();
      sample.status = 'issued';
      sample.issuedTo = issuedTo;
      sample.department = department;
      sample.issuedAt = at;
      sample.expectedReturn = expectedReturn;
      sample.issueNote = note;
      sample.takerPhoto = takerPhoto;
      sample.history = (sample.history || []).concat([{
        type: 'issued', to: issuedTo, department: department, by: byWhom,
        at: at, expectedReturn: expectedReturn, note: note
      }]);
      return sample;
    });
    if (!result.committed || !result.snapshot.exists()) throw new Error('Sample not found');
    return result.snapshot.val();
  }
  if (fn === 'returnSample') {
    const id = args[0], returnedBy = args[1];
    const ref = samplesRef.child(id);
    const result = await ref.transaction(function (sample) {
      if (!sample) return sample;
      const at = Date.now();
      const previousHolder = sample.issuedTo || '';
      sample.status = 'in-room';
      sample.returnedAt = at;
      sample.returnedBy = returnedBy;
      sample.history = (sample.history || []).concat([
        { type: 'returned', by: returnedBy, at: at, from: previousHolder }
      ]);
      return sample;
    });
    if (!result.committed || !result.snapshot.exists()) throw new Error('Sample not found');
    return result.snapshot.val();
  }
  throw new Error('Unknown Firebase operation: ' + fn);
}

/* ---------------- global error handling ---------------- */
// Route every database failure through here so an error is never silently swallowed.
function showError(err, context) {
  const msg = (err && err.message) ? err.message : String(err);
  console.error('Server error' + (context ? ' [' + context + ']' : '') + ':', err);
  document.getElementById('errorBanner').innerHTML =
    '<div class="errBanner"><b>Something went wrong' + (context ? ' (' + esc(context) + ')' : '') + ':</b><br>' + esc(msg) + '</div>';
  // also surface it as an alert so it can't be missed if the banner is off-screen
  alert((context ? context + ' failed: ' : 'Error: ') + msg);
}
function clearError() {
  const el = document.getElementById('errorBanner');
  if (el) el.innerHTML = '';
}
function onErr(context) {
  return function (err) { showError(err, context); };
}

const MY_NAME_KEY = 'crr_myName';
window.onload = function () {
  ensureFirebaseApp();
  firebase.auth().onAuthStateChanged(function (user) {
    if (user && ALLOWED_AUTH_EMAILS.indexOf(user.email) !== -1) startAdminApp(user);
    else showLogin();
  });
};

function startAdminApp(user) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  const isEmployee = user && user.email === EMPLOYEE_AUTH_EMAIL;

function showLogin() {
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
}

async function loginAdmin(event) {
  event.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  const button = document.getElementById('loginButton');
  errorEl.textContent = '';
  let authEmail = '';
  if (username.toLowerCase() === ADMIN_USERNAME.toLowerCase()) authEmail = ADMIN_AUTH_EMAIL;
  if (username.toLowerCase() === EMPLOYEE_USERNAME.toLowerCase()) authEmail = EMPLOYEE_AUTH_EMAIL;

    button.disabled = false; button.textContent = 'Sign in';

/* ---------------- helpers ---------------- */
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
}); }
function fmt(ts) { if (!ts) return '—'; const d = new Date(ts);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function isOverdue(s) { return s.status === 'issued' && s.expectedReturn && Date.now() > s.expectedReturn; }
function fmtDuration(hrs) { const h = Math.abs(hrs);
  if (h < 1) return Math.max(1, Math.round(h * 60)) + 'm';
  if (h < 24) return Math.round(h) + 'h';
  return Math.round(h / 24) + 'd'; }
function dueLabel(s) { if (!s.expectedReturn) return 'No deadline set';
  const diff = (s.expectedReturn - Date.now()) / 3600000;
  return diff < 0 ? 'Overdue by ' + fmtDuration(diff) : 'Due in ' + fmtDuration(diff); }
function todayStr() { const d = new Date(); const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10); }
function samplePhotos(s) { return (s.photos && s.photos.length) ? s.photos : []; }
// Called via onerror on any photo/avatar <img>. A corrupt or truncated data
// URL (e.g. a photo that got cut off hitting Google Sheets' 50,000-char
// cell limit) fails silently as the browser's generic broken-image icon —
// this swaps it for a clearly labeled placeholder instead.
function markPhotoBroken(imgEl) {
  const w = imgEl.offsetWidth || 56, h = imgEl.offsetHeight || 56;
  const round = imgEl.style.borderRadius === '50%';
  const div = document.createElement('div');
  div.style.cssText = 'width:' + w + 'px;height:' + h + 'px;display:flex;align-items:center;justify-content:center;' +
    'background:var(--paper-dim);border-radius:' + (round ? '50%' : '3px') + ';color:var(--red);font-size:11px;' +
    'text-align:center;flex-shrink:0;border:1px solid var(--paper-line);';
  div.title = 'Photo failed to load — please re-upload it';
  div.textContent = '⚠';
  if (imgEl.parentNode) imgEl.replaceWith(div);
}
function sealColor(label) { const m = SEAL_TYPES.find(function (t) { return t.label === label; }); return m ? m.color : '#999'; }
function uniqueVals(key) { const set = {}; SAMPLES.forEach(function (s) { if (s[key]) set[s[key]] = 1; }); return Object.keys(set).sort(); }

// Google Sheets cells hard-cap at 50,000 characters. A single photo's base64
// data URL can easily exceed that, in which case Sheets silently truncates
// it on save — producing a corrupt image that shows as a broken icon and
// can never be viewed. So we compress, measure the actual result, and keep
// shrinking until it's safely under the limit, instead of guessing a fixed
// size/quality up front.
//
// IMPORTANT: the "Log Sample" and "Edit" photos are stored as a JSON array
// in ONE shared sheet cell — so if a sample has several photos, they all
// have to fit under 50,000 characters *together*, not 50,000 each. The
// taker photo (issue form) has its own separate column, so it gets a
// bigger budget.
const PHOTO_MAX_CHARS_MULTI = 9000;   // per photo, when several share one cell
const PHOTO_MAX_CHARS_SINGLE = 40000; // one photo alone in its own cell
function readAndCompress(file, maxChars) {
  maxChars = maxChars || PHOTO_MAX_CHARS_MULTI;
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        let maxW = 480, quality = 0.6, attempts = 0;
        function render() {
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL('image/jpeg', quality);
        }
        let dataUrl = render();
        while (dataUrl.length > maxChars && attempts < 10) {
          if (quality > 0.3) quality -= 0.1; else maxW = Math.round(maxW * 0.8);
          dataUrl = render();
          attempts++;
        }
        if (dataUrl.length > maxChars) {
          reject(new Error('This photo is too large to store even after compression. Try retaking it with better lighting or a simpler background.'));
          return;
        }
        resolve(dataUrl);
      };
      img.onerror = function () { reject(new Error('Could not read this image file.')); };
      img.src = e.target.result;
    };
    reader.onerror = function () { reject(new Error('Could not read this file.')); };
    reader.readAsDataURL(file);
  });
}

/* ---------------- dashboard + banner ---------------- */
function renderDashboard() {
  const total = SAMPLES.length;
  const issued = SAMPLES.filter(function (s) { return s.status === 'issued'; });
  const overdue = issued.filter(isOverdue).length;
  const cards = [
    { label: 'Total samples', value: total, color: 'var(--text-on-ink)' },
    { label: 'In store', value: total - issued.length, color: 'var(--green)' },
    { label: 'Out', value: issued.length, color: 'var(--amber)' },
    { label: 'Overdue', value: overdue, color: overdue ? 'var(--red)' : 'var(--amber)' }
  ];
  document.getElementById('dashboardBar').innerHTML = cards.map(function (c) {
    return '<div class="statCard"><div class="statVal" style="color:' + c.color + '">' + c.value + '</div><div class="statLabel">' + c.label + '</div></div>';

function renderPendingBanner() {
  if (!MY_NAME) { document.getElementById('pendingBanner').innerHTML = ''; return; }

  document.getElementById('pendingBanner').innerHTML =

function toggleMenu() {

/* ---------------- register tab ---------------- */
function filterBarHtml(prefix, state, showStatus, showSampleType) {
  const buyers = uniqueVals('buyer'), merchants = uniqueVals('merchant');
  let html = '<div class="row" style="background:var(--paper); border-radius:4px; padding:6px 10px; margin-bottom:8px;">' +
    '<input placeholder="Search product, seal #, PO / order #" value="' + esc(state.q) + '" oninput="' + prefix + 'SetQ(this.value)" style="background:transparent;border:none;padding:4px 0;">' +
    '</div><div class="row" style="overflow-x:auto; gap:6px;">';
  if (showStatus) {
    html += '<select onchange="' + prefix + 'SetStatus(this.value)" style="width:auto;">' +
      '<option value="all">All status</option><option value="in-room"' + (state.status === 'in-room' ? ' selected' : '') + '>In room</option>' +
      '<option value="issued"' + (state.status === 'issued' ? ' selected' : '') + '>Issued</option></select>';
  }
  if (showSampleType) {
    html += '<select onchange="' + prefix + 'SetSampleType(this.value)" style="width:auto;"><option value="all">All sample types</option>' +
      SAMPLE_TYPES.map(function (t) { return '<option value="' + esc(t) + '"' + (state.sampleType === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select>';
  }

    merchants.map(function (m) { return '<option value="' + esc(m) + '"' + (state.merchant === m ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') + '</select>';
  html += '</div>';
  return html;
}
function regSetQ(v) { filters.q = v; renderRegisterList(); }
function regSetStatus(v) { filters.status = v; renderTab(); }
function regSetBuyer(v) { filters.buyer = v; renderTab(); }
function regSetMerchant(v) { filters.merchant = v; renderTab(); }
function regSetSampleType(v) { filters.sampleType = v; renderTab(); }

function matchesFilters(s, f) {
  const hay = [s.sealNumber, s.itemNumber, s.name, s.buyer, s.poNumber, s.merchant, s.location, s.sealType, s.sampleType]
    .filter(Boolean).join(' ').toLowerCase();
  const q = !f.q || hay.includes(f.q.toLowerCase());
  const buyer = f.buyer === 'all' || s.buyer === f.buyer;
  const merchant = f.merchant === 'all' || s.merchant === f.merchant;
  const st = !f.sampleType || f.sampleType === 'all' || s.sampleType === f.sampleType;
  const status = !f.status || f.status === 'all' || s.status === f.status;
  return q && buyer && merchant && st && status;
}

function registerHtml() {
  return '<div>' + filterBarHtml('reg', filters, true, true) +
    '<div id="registerList"></div></div>' + (setTimeout(renderRegisterList, 0), '');
}
function renderRegisterList() {
  const container = document.getElementById('registerList');
  if (!container) return;
  const filtered = SAMPLES.filter(function (s) { return matchesFilters(s, filters); });
  let html = '<p class="mutedInk" style="margin:6px 0;">' + filtered.length + ' of ' + SAMPLES.length + ' samples</p>';
  if (!filtered.length) { html += '<div class="empty">No samples match. Log one in the "Log Sample" tab.</div>'; }
  html += filtered.map(sampleRowHtml).join('');
  container.innerHTML = html;
}

function sampleRowHtml(s) {
  const photos = samplePhotos(s);
  const thumb = photos.length
    ? '<button class="thumb" style="padding:0;border:none;position:relative;" onclick=\'openGallery(' + JSON.stringify(photos) + ')\'><img src="' + esc(photos[0]) + '" class="thumb" style="margin:0;" onerror="markPhotoBroken(this)">' +
      (photos.length > 1 ? '<span style="position:absolute;bottom:-4px;right:-4px;background:var(--ink);color:var(--text-on-ink);font-size:9px;font-weight:700;padding:0 3px;border-radius:3px;">+' + (photos.length - 1) + '</span>' : '') + '</button>'
    : '<div class="thumbEmpty">📷</div>';
  const statusBadge = s.status === 'in-room'
    ? '<span class="stampBadge" style="color:var(--green); border-color:var(--green);">In Room</span>'
    : (isOverdue(s) ? '<span class="stampBadge" style="color:var(--red); border-color:var(--red);">Overdue</span>' : '<span class="stampBadge" style="color:var(--amber); border-color:var(--amber);">Issued</span>');
  const metaLine = [s.buyer && ('Buyer: ' + s.buyer), s.poNumber && ('PO: ' + s.poNumber), s.merchant && ('Merchant: ' + s.merchant), s.itemNumber && ('RC: ' + s.itemNumber)]
    .filter(Boolean).join(' · ');
  const statusLine = s.status === 'in-room'
    ? ('Logged ' + (s.sampleDate || '') + ' by ' + (s.loggedBy || '—'))

  return '<div class="sampleRow">' + thumb +
    '<div style="flex:1; min-width:0;">' +
    '<div class="row between"><span style="font-weight:700; font-size:13px; font-family:monospace;">' +
    (s.sealType ? '<span class="dot" style="background:' + sealColor(s.sealType) + ';margin-right:4px;"></span>' : '') +
    esc(s.sealNumber) + '</span>' + statusBadge + '</div>' +
    '<p style="margin:2px 0; font-weight:600; font-size:13px;">' + esc(s.name) + '</p>' +
    (s.sampleType ? '<p class="muted" style="font-weight:600; color:var(--kraft); margin:0;">' + esc(s.sampleType) + '</p>' : '') +
    (metaLine ? '<p class="muted" style="margin:2px 0;">' + esc(metaLine) + '</p>' : '') +
    '<p class="muted" style="margin:2px 0;">' + statusLine + '</p>' +
    '<div class="row between" style="margin-top:4px;">' +
    '<button class="btn-ghost" style="font-size:11px; padding:3px 8px;" onclick="editLocation(\'' + s.id + '\')">📍 ' + esc(s.location || 'Set location') + '</button>' +
    '<div class="row" style="gap:2px;">' +

    '<button class="btn-icon" onclick="openHistory(\'' + s.id + '\')" title="History">🕐</button>' +
    '<button class="btn-icon" onclick="openEdit(\'' + s.id + '\')" title="Edit">✎</button>' +
    '</div></div></div></div>';
}

async function editLocation(id) {
  const s = SAMPLES.find(function (x) { return x.id === id; });
  const val = prompt('Rack / location for this sample:', s.location || '');
  if (val === null) return;
  try {
    await apiCall('updateSample', [id, { location: val.trim() }]);
    clearError(); refreshAll();
  } catch (err) { showError(err, 'Updating location'); }
}

/* ---------------- gallery / label / history / edit modals ---------------- */
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

/* Cross-platform photo source picker.
   iOS Safari shows "Take Photo" as an option on any accept="image/*" input
   regardless of the capture attribute, but many Android browsers/WebViews
   only surface the camera when capture is explicitly set — and setting it
   unconditionally then hides the gallery option instead. So we keep two
   real inputs (one with capture, one without) and let the user pick —
   except on iOS/iPadOS, where the capture attribute is unreliable
   (tapping "Take Photo" can silently do nothing, especially on iPad),
   so there we skip our own chooser and just open the plain gallery
   input: Safari's native file picker already offers "Take Photo or
   Video / Photo Library / Browse" on its own, no capture attribute
   needed. */
function isIOS_() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function openPhotoSourcePicker(cameraInputId, galleryInputId) {
  if (isIOS_()) { document.getElementById(galleryInputId).click(); return; }
  document.getElementById('modalRoot').innerHTML =
    '<div class="modalBg" onclick="if(event.target===this) closeModal()"><div class="modal" style="text-align:center;">' +
    '<p style="font-weight:700; margin-bottom:10px;">Add photo</p>' +
    '<button class="btn-ghost" style="width:100%; margin-bottom:8px;" onclick="closeModal(); document.getElementById(\'' + cameraInputId + '\').click();">📷 Take Photo</button>' +
    '<button class="btn-ghost" style="width:100%;" onclick="closeModal(); document.getElementById(\'' + galleryInputId + '\').click();">🖼 Choose from Library</button>' +
    '</div></div>';
}

function openGallery(photos, startIndex) {
  const start = startIndex || 0;
  document.getElementById('modalRoot').innerHTML =
    '<div class="modalBg" onclick="if(event.target===this) closeModal()"><div class="modal" style="text-align:center;">' +
    '<div class="row between"><p style="font-weight:700;">Photo ' + (start + 1) + ' of ' + photos.length + '</p><button class="btn-icon" onclick="closeModal()">✕</button></div>' +
    '<img src="' + esc(photos[start]) + '" style="width:100%; max-height:60vh; object-fit:contain; border-radius:4px; border:1px solid var(--paper-line); background:#000;" onerror="markPhotoBroken(this)">' +
    (photos.length > 1 ?
      '<div class="row between" style="margin-top:8px;">' +
      '<button class="btn-ghost" onclick="openGallery(' + JSON.stringify(photos).replace(/"/g, '&quot;') + ',' + ((start - 1 + photos.length) % photos.length) + ')">‹ Prev</button>' +
      '<button class="btn-ghost" onclick="openGallery(' + JSON.stringify(photos).replace(/"/g, '&quot;') + ',' + ((start + 1) % photos.length) + ')">Next ›</button>' +
      '</div>' : '') +
    '<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px;">' +
    photos.map(function (p, i) { return '<img src="' + esc(p) + '" onclick="openGallery(' + JSON.stringify(photos).replace(/"/g, '&quot;') + ',' + i + ')" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px; cursor:pointer; border:2px solid ' + (i === start ? 'var(--red)' : 'var(--paper-line)') + ';" onerror="markPhotoBroken(this)">'; }).join('') +
    '</div></div></div>';
}

function openLabel(id) {
  const s = SAMPLES.find(function (x) { return x.id === id; });
  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(s.sealNumber);
  document.getElementById('modalRoot').innerHTML =
    '<div class="modalBg" onclick="if(event.target===this) closeModal()"><div class="modal" style="text-align:center; background:#fff; color:#111;">' +
    '<img src="' + qrUrl + '" style="margin:0 auto;">' +
    '<p style="font-size:22px; font-weight:700; font-family:monospace; margin:8px 0 0;">' + esc(s.sealNumber) + '</p>' +
    (s.sampleType ? '<p style="font-weight:600; color:#555;">' + esc(s.sampleType) + '</p>' : '') +
    '<p style="margin:2px 0;">' + esc(s.name) + '</p>' +
    '<div class="row" style="margin-top:12px;"><button class="btn-primary" onclick="window.print()">Print label</button>' +
    '<button class="btn-ghost" onclick="closeModal()">Close</button></div></div></div>';
}

function openHistory(id) {
  const s = SAMPLES.find(function (x) { return x.id === id; });
  const entries = (s.history || []).slice().reverse();
  const rows = entries.map(function (h) {
    let detail = '';
    if (h.type === 'logged') detail = 'Logged by ' + esc(h.by);
    if (h.type === 'issued') detail = 'To ' + esc(h.to) + ' (' + esc(h.department) + ') by ' + esc(h.by) + (h.expectedReturn ? ' · due ' + fmt(h.expectedReturn) : '') + (h.note ? ' · ' + esc(h.note) : '');
    if (h.type === 'returned') detail = 'Returned by ' + esc(h.by) + (h.from ? ' (was with ' + esc(h.from) + ')' : '');
    const color = h.type === 'returned' ? 'var(--green)' : h.type === 'issued' ? 'var(--amber)' : 'var(--kraft)';
    return '<div style="padding-left:10px; border-left:2px solid var(--paper-line); margin-bottom:8px;">' +
      '<p style="font-size:11px; font-weight:700; text-transform:uppercase; color:' + color + '; margin:0;">' + h.type + '</p>' +
      '<p class="muted" style="margin:0;">' + fmt(h.at) + '</p><p style="font-size:12px; margin:2px 0;">' + detail + '</p></div>';
  }).join('');
  document.getElementById('modalRoot').innerHTML =
    '<div class="modalBg" onclick="if(event.target===this) closeModal()"><div class="modal">' +
    '<div class="row between"><p style="font-weight:700;">History · ' + esc(s.sealNumber) + '</p><button class="btn-icon" onclick="closeModal()">✕</button></div>' +
    (rows || '<p class="muted">No history yet.</p>') + '</div></div>';
}

let editPhotos = [];
function openEdit(id) {
  const s = SAMPLES.find(function (x) { return x.id === id; });
  editPhotos = samplePhotos(s).slice();
  document.getElementById('modalRoot').innerHTML =
    '<div class="modalBg" onclick="if(event.target===this) closeModal()"><div class="modal">' +
    '<div class="row between"><p style="font-weight:700;">Edit sample</p><button class="btn-icon" onclick="closeModal()">✕</button></div>' +
    '<label class="field">Photos</label><div id="editPhotoArea"></div>' +
    '<input type="file" id="editPhotoInputCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleEditPhotos(event)">' +
    '<input type="file" id="editPhotoInputGallery" accept="image/*" multiple style="display:none;" onchange="handleEditPhotos(event)">' +
    fieldHtml('Seal number', 'input', 'editSealNumber', s.sealNumber) +
    '<div class="grid2">' +
    selectFieldHtml('Seal type', 'editSealType', SEAL_TYPES.map(function (t) { return t.label; }), s.sealType) +
    selectFieldHtml('Sample type', 'editSampleType', SAMPLE_TYPES, s.sampleType) + '</div>' +
    fieldHtml('Sample name', 'input', 'editName', s.name) +
    '<div class="grid2">' +
    fieldHtml('Buyer', 'input', 'editBuyer', s.buyer) +
    fieldHtml('PO number', 'input', 'editPo', s.poNumber) +
    fieldHtml('Merchant', 'input', 'editMerchant', s.merchant) +
    fieldHtml('RC / Item No.', 'input', 'editItem', s.itemNumber) +
    fieldHtml('Location', 'input', 'editLoc', s.location) + '</div>' +
    fieldHtml('Notes', 'textarea', 'editDesc', s.description) +
    '<div class="row" style="margin-top:8px;">' +
    '<button class="btn-primary" id="saveEditBtn" onclick="saveEdit(\'' + id + '\')">Save changes</button>' +
    '<button class="btn-red" onclick="deleteSampleConfirm(\'' + id + '\')">🗑</button>' +
    '</div></div></div>';
  renderEditPhotos();
}
function fieldHtml(label, tag, id, val) {
  if (tag === 'textarea') return '<div><label class="field">' + label + '</label><textarea id="' + id + '" rows="2">' + esc(val || '') + '</textarea></div>';
  return '<div><label class="field">' + label + '</label><input id="' + id + '" value="' + esc(val || '') + '"></div>';
}
function selectFieldHtml(label, id, options, selected) {
  return '<div><label class="field">' + label + '</label><select id="' + id + '">' +
    options.map(function (o) { return '<option value="' + esc(o) + '"' + (o === selected ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></div>';
}
function renderEditPhotos() {
  const area = document.getElementById('editPhotoArea'); if (!area) return;
  area.innerHTML = editPhotos.map(function (p, i) {
    return '<div class="photoThumb"><img src="' + esc(p) + '" onclick="openGallery(editPhotos,' + i + ')" style="cursor:pointer;" onerror="markPhotoBroken(this)"><button class="rm" onclick="removeEditPhoto(' + i + ')">✕</button></div>';
  }).join('') + '<div class="photoThumb"><button class="addPhotoBtn" onclick="openPhotoSourcePicker(\'editPhotoInputCamera\',\'editPhotoInputGallery\')">📷 Add</button></div>';
}
function removeEditPhoto(i) { editPhotos.splice(i, 1); renderEditPhotos(); }
async function handleEditPhotos(e) {
  const files = Array.from(e.target.files || []);
  for (const f of files) {
    try { editPhotos.push(await readAndCompress(f)); }
    catch (err) { alert('Could not add photo: ' + (err && err.message ? err.message : err)); }
  }
  renderEditPhotos();
  e.target.value = '';
}
function saveEdit(id) {
  const patch = {
    sealNumber: document.getElementById('editSealNumber').value.trim(),
    sealType: document.getElementById('editSealType').value,
    sampleType: document.getElementById('editSampleType').value,
    name: document.getElementById('editName').value.trim(),
    buyer: document.getElementById('editBuyer').value.trim(),
    poNumber: document.getElementById('editPo').value.trim(),
    merchant: document.getElementById('editMerchant').value.trim(),
    itemNumber: document.getElementById('editItem').value.trim(),
    location: document.getElementById('editLoc').value.trim(),
    description: document.getElementById('editDesc').value.trim(),
    photos: editPhotos
  };
  if (!patch.sealNumber || !patch.name) { alert('Seal number and sample name are required.'); return; }
  const btn = document.getElementById('saveEditBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  apiCall('updateSample', [id, patch]).then(function () {
    clearError(); closeModal(); refreshAll();
  }).catch(function (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
    showError(err, 'Saving sample');
  });
}
async function deleteSampleConfirm(id) {
  if (!confirm('Delete this sample entry permanently?')) return;
  try {
    await apiCall('deleteSample', [id]);
    clearError(); closeModal(); refreshAll();
  } catch (err) { showError(err, 'Deleting sample'); }
}

/* ---------------- log sample tab ---------------- */
function logHtml() {
  return '<div class="card">' +
    '<h2 style="font-size:14px; margin:0 0 10px;">Log a new sample</h2>' +
    fieldHtml('Seal number *', 'input', 'logSeal', '') +
    '<div class="grid2">' + selectFieldHtml('Seal type', 'logSealType', SEAL_TYPES.map(function (t) { return t.label; }), SEAL_TYPES[0].label) +
    selectFieldHtml('Sample type', 'logSampleType', SAMPLE_TYPES, SAMPLE_TYPES[0]) + '</div>' +
    fieldHtml('Sample name / source *', 'input', 'logName', '') +
    '<div class="grid2">' +
    '<div><label class="field">Date</label><input type="date" id="logDate" value="' + todayStr() + '"></div>' +
    fieldHtml('PO number', 'input', 'logPo', '') +
    fieldHtml('Buyer name', 'input', 'logBuyer', '') +
    fieldHtml('Merchant', 'input', 'logMerchant', '') +
    fieldHtml('RC / Item No.', 'input', 'logItem', '') +
    fieldHtml('Rack / location', 'input', 'logLoc', '') + '</div>' +
    fieldHtml('Notes', 'textarea', 'logDesc', '') +
    '<label class="field" style="margin-top:8px;">Photos</label><div id="logPhotoArea"></div>' +
    '<input type="file" id="logPhotoInputCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleLogPhotos(event)">' +
    '<input type="file" id="logPhotoInputGallery" accept="image/*" multiple style="display:none;" onchange="handleLogPhotos(event)">' +
    '<button class="btn-primary" id="submitLogBtn" style="margin-top:12px;" onclick="submitLog()">🖋 Log sample into register</button>' +
    '</div>' + (setTimeout(renderLogPhotos, 0), '');
}
function renderLogPhotos() {
  const area = document.getElementById('logPhotoArea'); if (!area) return;
  area.innerHTML = logPhotos.map(function (p, i) {
    return '<div class="photoThumb"><img src="' + esc(p) + '" onclick="openGallery(logPhotos,' + i + ')" style="cursor:pointer;" onerror="markPhotoBroken(this)"><button class="rm" onclick="removeLogPhoto(' + i + ')">✕</button></div>';
  }).join('') + '<div class="photoThumb"><button class="addPhotoBtn" onclick="openPhotoSourcePicker(\'logPhotoInputCamera\',\'logPhotoInputGallery\')">📷 Add</button></div>';
}
function removeLogPhoto(i) { logPhotos.splice(i, 1); renderLogPhotos(); }
async function handleLogPhotos(e) {
  const files = Array.from(e.target.files || []);
  for (const f of files) {
    try { logPhotos.push(await readAndCompress(f)); }
    catch (err) { alert('Could not add photo: ' + (err && err.message ? err.message : err)); }
  }
  renderLogPhotos();
  e.target.value = '';
}
function submitLog() {
  const sealNumber = document.getElementById('logSeal').value.trim();
  const name = document.getElementById('logName').value.trim();
  if (!sealNumber || !name) { alert('Seal number and sample name are required.'); return; }
  const sample = {
    sealNumber: sealNumber,
    sealType: document.getElementById('logSealType').value,
    sampleType: document.getElementById('logSampleType').value,
    name: name,
    sampleDate: document.getElementById('logDate').value,
    buyer: document.getElementById('logBuyer').value.trim(),
    poNumber: document.getElementById('logPo').value.trim(),
    merchant: document.getElementById('logMerchant').value.trim(),
    itemNumber: document.getElementById('logItem').value.trim(),
    location: document.getElementById('logLoc').value.trim(),
    description: document.getElementById('logDesc').value.trim(),
    photos: logPhotos,
    loggedBy: MY_NAME || 'Unknown'
  };
  const btn = document.getElementById('submitLogBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Logging…'; }
  apiCall('addSample', [sample]).then(function () {
    clearError();
    logPhotos = [];
    switchTab('register');
    refreshAll();
  }).catch(function (err) {
    if (btn) { btn.disabled = false; btn.textContent = '🖋 Log sample into register'; }
    showError(err, 'Logging sample');
  });
}

/* ---------------- issue / return tab ---------------- */
let actionMode = 'issue';
function actionHtml() {
  const inRoomTotal = SAMPLES.filter(function (s) { return s.status === 'in-room'; }).length;
  const issuedTotal = SAMPLES.filter(function (s) { return s.status === 'issued'; }).length;
  return '<div>' +
    '<div class="row" style="margin-bottom:8px;">' +
    '<button class="tab ' + (actionMode === 'issue' ? 'active' : '') + '" onclick="setActionMode(\'issue\')">Issue (' + inRoomTotal + ')</button>' +
    '<button class="tab ' + (actionMode === 'return' ? 'active' : '') + '" onclick="setActionMode(\'return\')">Return (' + issuedTotal + ')</button>' +
    '</div>' + filterBarHtml('act', actionFilters, false, false) +
    '<div id="actionList"></div></div>' + (setTimeout(renderActionList, 0), '');
}
function actSetQ(v) { actionFilters.q = v; renderActionList(); }
function actSetBuyer(v) { actionFilters.buyer = v; renderTab(); }
function actSetMerchant(v) { actionFilters.merchant = v; renderTab(); }
function setActionMode(m) { actionMode = m; renderTab(); }

function renderActionList() {
  const container = document.getElementById('actionList'); if (!container) return;
  if (actionMode === 'issue') {
    const list = SAMPLES.filter(function (s) { return s.status === 'in-room' && matchesFilters(s, Object.assign({}, actionFilters, { status: 'all', sampleType: 'all' })); });
    container.innerHTML = list.length ? list.map(issueRowHtml).join('') : '<div class="empty">No samples match.</div>';
  } else {
    const list = SAMPLES.filter(function (s) { return s.status === 'issued' && matchesFilters(s, Object.assign({}, actionFilters, { status: 'all', sampleType: 'all' })); });
    container.innerHTML = list.length ? list.map(returnRowHtml).join('') : '<div class="empty">Nothing checked out.</div>';
  }
}

function deadlinePresets() {
  const now = Date.now();
  const eod = new Date(); eod.setHours(18, 0, 0, 0);
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1); tmr.setHours(10, 0, 0, 0);
  return [
    { label: '2 hours', ts: now + 2 * 3600000 }, { label: '4 hours', ts: now + 4 * 3600000 },
    { label: 'End of day', ts: eod.getTime() > now ? eod.getTime() : now + 4 * 3600000 },
    { label: 'Tomorrow 10am', ts: tmr.getTime() }
  ];
}
let issueOpenId = null, issueDeadline = null;
function issueRowHtml(s) {
  const open = issueOpenId === s.id;
  let form = '';
  if (open) {
    const presets = deadlinePresets();
    const photo = issuePhotoCache[s.id];
    form = '<div style="margin-top:8px;">' +
      '<input id="taker_' + s.id + '" placeholder="Who is taking this sample?">' +
      '<select id="dept_' + s.id + '" style="margin-top:6px;">' + DEPARTMENTS.map(function (d) { return '<option value="' + d + '">' + d + '</option>'; }).join('') + '</select>' +
      '<label class="field" style="margin-top:8px;">Photo of person taking it</label>' +
      '<div class="row">' + (photo ? '<img src="' + photo + '" style="width:52px;height:52px;border-radius:50%;object-fit:cover;" onerror="markPhotoBroken(this)">' : '<div class="avatarEmpty">📷</div>') +
      '<button class="btn-ghost" onclick="openPhotoSourcePicker(\'takerPhotoInputCamera_' + s.id + '\',\'takerPhotoInputGallery_' + s.id + '\')">' + (photo ? 'Retake' : 'Add photo') + '</button>' +
      '<input type="file" id="takerPhotoInputCamera_' + s.id + '" accept="image/*" capture="user" style="display:none;" onchange="handleTakerPhoto(event,\'' + s.id + '\')">' +
      '<input type="file" id="takerPhotoInputGallery_' + s.id + '" accept="image/*" style="display:none;" onchange="handleTakerPhoto(event,\'' + s.id + '\')"></div>' +
      '<label class="field" style="margin-top:8px;">Must be returned by</label>' +
      '<div class="row" style="flex-wrap:wrap;">' + presets.map(function (p) {
        const sel = issueDeadline === p.ts;
        return '<button class="btn-ghost" style="' + (sel ? 'background:var(--ink);color:var(--text-on-ink);' : '') + '" onclick="pickDeadline(\'' + s.id + '\',' + p.ts + ')">' + p.label + '</button>';
      }).join('') + '</div>' +
      (issueDeadline ? '<p class="muted">Deadline: ' + fmt(issueDeadline) + '</p>' : '') +
      '<input id="note_' + s.id + '" placeholder="Reason / note (optional)" style="margin-top:6px;">' +
      '<p class="muted" style="color:var(--red); margin-top:6px;">⚠ This sample must stay on factory premises and be returned by the deadline above.</p>' +
      '<button class="btn-primary" id="confirmIssueBtn_' + s.id + '" style="margin-top:8px;" onclick="confirmIssue(\'' + s.id + '\')">Confirm hand-off</button>' +
      '</div>';
  }
  return '<div class="sampleRow" style="flex-direction:column;">' +
    '<div class="row between" style="width:100%;"><div><span style="font-weight:700; font-family:monospace; font-size:13px;">' + esc(s.sealNumber) + '</span>' +
    '<p style="margin:2px 0; font-size:13px;">' + esc(s.name) + '</p></div>' +
    '<button class="btn-amber" onclick="toggleIssue(\'' + s.id + '\')">Issue ' + (open ? '▲' : '▶') + '</button></div>' + form + '</div>';
}
function toggleIssue(id) { issueOpenId = (issueOpenId === id ? null : id); issueDeadline = null; renderActionList(); }
function pickDeadline(id, ts) { issueDeadline = ts; renderActionList(); }
async function handleTakerPhoto(e, id) {
  const f = e.target.files[0]; if (!f) return;
  try { issuePhotoCache[id] = await readAndCompress(f, PHOTO_MAX_CHARS_SINGLE); }
  catch (err) { alert('Could not add photo: ' + (err && err.message ? err.message : err)); }
  renderActionList();
}
function confirmIssue(id) {
  const taker = document.getElementById('taker_' + id).value.trim();
  if (!taker || !issueDeadline) { alert('Enter who is taking it and pick a return deadline.'); return; }
  const department = document.getElementById('dept_' + id).value;
  const note = document.getElementById('note_' + id).value.trim();
  const photo = issuePhotoCache[id] || null;
  const btn = document.getElementById('confirmIssueBtn_' + id);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  apiCall('issueSample', [id, taker, department, issueDeadline, note, photo, MY_NAME || taker]).then(function () {
    clearError();
    issueOpenId = null; issueDeadline = null; delete issuePhotoCache[id];
    refreshAll();
  }).catch(function (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Confirm hand-off'; }
    showError(err, 'Issuing sample');
  });
}

function returnRowHtml(s) {
  const overdue = isOverdue(s);
  const avatar = s.takerPhoto ? '<img src="' + esc(s.takerPhoto) + '" class="avatar" style="border:2px solid ' + (overdue ? 'var(--red)' : 'var(--amber)') + ';" onerror="markPhotoBroken(this)">' : '<div class="avatarEmpty">👤</div>';
  return '<div class="sampleRow"><div class="row" style="flex:1;">' + avatar +
    '<div style="flex:1; min-width:0;"><span style="font-weight:700; font-family:monospace; font-size:13px;">' + esc(s.sealNumber) + '</span>' +
    '<p style="margin:2px 0; font-size:13px;">' + esc(s.name) + '</p>' +
    '<p class="muted" style="margin:0;">With ' + esc(s.issuedTo) + (s.department ? ' (' + esc(s.department) + ')' : '') + '</p>' +
    '<p style="font-size:11px; font-weight:700; margin:0; color:' + (overdue ? 'var(--red)' : 'var(--amber)') + ';">' + dueLabel(s) + '</p></div></div>' +
    '<button class="btn-green" onclick="confirmReturn(\'' + s.id + '\')">✓ Returned</button></div>';
}
async function confirmReturn(id) {
  try {
    await apiCall('returnSample', [id, MY_NAME || 'Unknown']);
    clearError(); refreshAll();
  } catch (err) { showError(err, 'Returning sample'); }
}

/* ---------------- supervisor tab ---------------- */
function supervisorHtml() {
  const issued = SAMPLES.filter(function (s) { return s.status === 'issued'; })
    .sort(function (a, b) { return (a.expectedReturn || Infinity) - (b.expectedReturn || Infinity); });
  const overdue = issued.filter(isOverdue).length;
  const inRoom = SAMPLES.length - issued.length;
  let html = '<div class="grid4" style="grid-template-columns:repeat(3,1fr); margin-bottom:12px;">' +
    '<div class="statCard"><div class="statVal">' + SAMPLES.length + '</div><div class="statLabel">Total logged</div></div>' +
    '<div class="statCard"><div class="statVal" style="color:var(--green);">' + inRoom + '</div><div class="statLabel">In room</div></div>' +
    '<div class="statCard"><div class="statVal" style="color:' + (overdue ? 'var(--red)' : 'var(--amber)') + ';">' + overdue + '</div><div class="statLabel">Overdue</div></div></div>';
  if (!issued.length) { html += '<div class="empty">Nothing outstanding. All samples accounted for.</div>'; }
  html += issued.map(function (s) {
    const late = isOverdue(s);
    const avatar = s.takerPhoto ? '<img src="' + esc(s.takerPhoto) + '" class="avatar" style="border:2px solid ' + (late ? 'var(--red)' : 'var(--amber)') + ';" onerror="markPhotoBroken(this)">' : '<div class="avatarEmpty">👤</div>';
    return '<div class="sampleRow" style="border-left:4px solid ' + (late ? 'var(--red)' : 'var(--amber)') + ';">' + avatar +
      '<div style="flex:1; min-width:0;"><div class="row between"><span style="font-weight:700; font-family:monospace; font-size:13px;">' + esc(s.sealNumber) + '</span>' +
      '<span style="font-size:11px; font-weight:700; color:' + (late ? 'var(--red)' : 'var(--amber)') + ';">⏱ ' + dueLabel(s) + '</span></div>' +
      '<p style="margin:2px 0; font-size:13px;">' + esc(s.name) + '</p>' +
      '<p class="muted" style="margin:0;">Held by <b>' + esc(s.issuedTo) + '</b>' + (s.department ? ' · ' + esc(s.department) : '') + ' · out since ' + fmt(s.issuedAt) + (s.issueNote ? ' · ' + esc(s.issueNote) : '') + '</p></div></div>';
  }).join('');
  return html;
}
</script>
</body>
</html>
